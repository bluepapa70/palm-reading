<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d0618"/>
    </radialGradient>
    <radialGradient id="palmGlow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.5"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>

  <!-- Glow behind palm -->
  <ellipse cx="256" cy="310" rx="140" ry="120" fill="url(#palmGlow)"/>

  <!-- Palm / Hand shape -->
  <!-- Thumb -->
  <path d="M170 330 Q150 300 155 265 Q160 240 175 245 Q190 248 188 278 L185 330Z"
        fill="#e2c4ff" opacity="0.9"/>
  <!-- Index finger -->
  <path d="M195 330 L192 210 Q193 185 207 185 Q221 185 222 210 L220 330Z"
        fill="#e2c4ff" opacity="0.9"/>
  <!-- Middle finger -->
  <path d="M227 330 L225 195 Q226 168 241 168 Q256 168 257 195 L255 330Z"
        fill="#e2c4ff" opacity="0.9"/>
  <!-- Ring finger -->
  <path d="M262 330 L260 205 Q261 180 275 180 Q289 180 290 205 L288 330Z"
        fill="#e2c4ff" opacity="0.9"/>
  <!-- Pinky finger -->
  <path d="M295 330 L294 225 Q295 205 307 205 Q319 205 320 225 L318 330Z"
        fill="#e2c4ff" opacity="0.9"/>
  <!-- Palm base -->
  <path d="M170 330 Q160 360 168 390 Q175 415 210 425 Q256 432 302 425 Q335 415 342 390 Q350 360 340 330Z"
        fill="#e2c4ff" opacity="0.9"/>

  <!-- Palm lines with glow -->
  <!-- Life line -->
  <path d="M210 340 Q200 360 198 385 Q197 405 205 420"
        fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" filter="url(#glow)" opacity="0.95"/>
  <!-- Head line -->
  <path d="M190 335 Q220 330 260 332 Q290 333 315 340"
        fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Heart line -->
  <path d="M192 320 Q230 312 265 316 Q295 319 318 326"
        fill="none" stroke="#e879f9" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Fate line -->
  <path d="M254 420 Q256 390 257 360 Q258 340 257 310"
        fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>

  <!-- Sparkles -->
  <g filter="url(#softGlow)">
    <polygon points="256,95 260,108 273,108 263,116 267,129 256,121 245,129 249,116 239,108 252,108"
             fill="#fde68a" opacity="0.9"/>
    <polygon points="130,155 132,162 139,162 134,166 136,173 130,169 124,173 126,166 121,162 128,162"
             fill="#c084fc" opacity="0.8"/>
    <polygon points="382,155 384,162 391,162 386,166 388,173 382,169 376,173 378,166 373,162 380,162"
             fill="#818cf8" opacity="0.8"/>
    <circle cx="140" cy="230" r="4" fill="#fde68a" opacity="0.7"/>
    <circle cx="372" cy="230" r="4" fill="#fde68a" opacity="0.7"/>
    <circle cx="256" cy="140" r="3" fill="#e879f9" opacity="0.6"/>
  </g>
</svg>
