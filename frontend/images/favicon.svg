<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f0d0ff"/>
      <stop offset="30%" stop-color="#c580ff"/>
      <stop offset="65%" stop-color="#8030c0"/>
      <stop offset="100%" stop-color="#3a0060"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b06aff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b06aff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#08000f"/>
  <!-- Outer glow -->
  <circle cx="16" cy="17" r="12" fill="url(#glow)"/>
  <!-- Crystal ball -->
  <circle cx="16" cy="17" r="10" fill="url(#ball)"/>
  <!-- Glass shine highlight -->
  <ellipse cx="13" cy="13" rx="2.8" ry="1.6" fill="white" fill-opacity="0.38" transform="rotate(-25,13,13)"/>
  <!-- Star sparkles -->
  <circle cx="23" cy="7" r="1.1" fill="white" fill-opacity="0.75"/>
  <circle cx="26" cy="11" r="0.6" fill="white" fill-opacity="0.5"/>
  <circle cx="6"  cy="9"  r="0.7" fill="white" fill-opacity="0.45"/>
</svg>
